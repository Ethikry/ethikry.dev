# ethikry.dev: the portfolio's static build plus the router in worker/index.js.
#
#   npm run deploy      (build → leak check → wrangler deploy)
#
# Deploys as `ethikry-projects-router`, the Worker that already owns the
# ethikry.dev custom domain, so it replaces the old placeholder in place.
# song-rank's Worker (`ethikry-song-rank`) must exist for the binding below.
name = "ethikry-projects-router"
main = "worker/index.js"
compatibility_date = "2025-09-01"
routes = [{ pattern = "ethikry.dev", custom_domain = true }]
workers_dev = false
preview_urls = false

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
# Only song-rank's paths need the script; everything else is served straight
# from the asset store without invoking it.
run_worker_first = ["/projects/song-rank", "/projects/song-rank/*"]

[[services]]
binding = "SONG_RANK"
service = "ethikry-song-rank"
